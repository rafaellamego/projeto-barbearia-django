{% if messages %}
<style>
  .toast-container {
    position: fixed;
    top: 1.1rem;
    right: 1.25rem;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: .55rem;
    max-width: min(360px, calc(100vw - 2.5rem));
  }

  .toast {
    display: flex;
    align-items: flex-start;
    gap: .65rem;
    padding: .8rem 1rem;
    border-radius: .75rem;
    font-size: .88rem;
    line-height: 1.4;
    backdrop-filter: blur(14px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.45);
    animation: toast-in .25s ease;
    transition: opacity .35s ease, transform .35s ease;
  }
  .toast.toast-saindo {
    opacity: 0;
    transform: translateX(30px);
  }

  @keyframes toast-in {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* Barra de progresso do auto-dismiss */
  .toast::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    height: 3px;
    border-radius: 0 0 .75rem .75rem;
    animation: toast-progress 4s linear forwards;
  }
  .toast { position: relative; overflow: hidden; }

  @keyframes toast-progress {
    from { width: 100%; }
    to   { width: 0%; }
  }

  /* Variantes de cor */
  .toast-success {
    background: rgba(16,185,129,0.18);
    border: 1px solid rgba(16,185,129,0.45);
    color: #d1fae5;
  }
  .toast-success::after { background: rgba(16,185,129,0.8); }

  .toast-error, .toast-danger {
    background: rgba(239,68,68,0.18);
    border: 1px solid rgba(239,68,68,0.45);
    color: #fee2e2;
  }
  .toast-error::after, .toast-danger::after { background: rgba(239,68,68,0.8); }

  .toast-warning {
    background: rgba(234,179,8,0.18);
    border: 1px solid rgba(234,179,8,0.45);
    color: #fef9c3;
  }
  .toast-warning::after { background: rgba(234,179,8,0.8); }

  .toast-info {
    background: rgba(59,130,246,0.18);
    border: 1px solid rgba(59,130,246,0.45);
    color: #dbeafe;
  }
  .toast-info::after { background: rgba(59,130,246,0.8); }

  /* Ícone e texto */
  .toast-icon { font-size: 1rem; flex-shrink: 0; margin-top: .05rem; }
  .toast-text { flex: 1; }

  /* Botão fechar */
  .toast-close {
    background: none;
    border: none;
    color: inherit;
    opacity: .55;
    cursor: pointer;
    font-size: .8rem;
    padding: 0;
    flex-shrink: 0;
    line-height: 1;
    margin-top: .1rem;
    transition: opacity .15s;
  }
  .toast-close:hover { opacity: 1; }
</style>

<div class="toast-container" role="region" aria-label="Notificações" aria-live="polite">
  {% for message in messages %}
  {% with tag=message.tags %}
  <div class="toast toast-{{ tag }}"
       role="{% if tag == 'error' or tag == 'danger' %}alert{% else %}status{% endif %}"
       aria-live="{% if tag == 'error' or tag == 'danger' %}assertive{% else %}polite{% endif %}"
       aria-atomic="true">
    <span class="toast-icon" aria-hidden="true">
      {% if tag == 'success' %}✅
      {% elif tag == 'error' or tag == 'danger' %}❌
      {% elif tag == 'warning' %}⚠️
      {% else %}ℹ️{% endif %}
    </span>
    <span class="toast-text">{{ message }}</span>
    <button class="toast-close" aria-label="Fechar notificação">✕</button>
  </div>
  {% endwith %}
  {% endfor %}
</div>

<script>
(function () {
  var DURACAO = 4000;   // ms até começar a sair
  var ANIMACAO = 350;   // ms da animação de saída

  function removerToast(toast) {
    toast.classList.add('toast-saindo');
    setTimeout(function () {
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, ANIMACAO);
  }

  document.querySelectorAll('.toast').forEach(function (toast) {
    // Auto-dismiss
    var timer = setTimeout(function () { removerToast(toast); }, DURACAO);

    // Botão X
    var btn = toast.querySelector('.toast-close');
    if (btn) {
      btn.addEventListener('click', function () {
        clearTimeout(timer);
        removerToast(toast);
      });
    }

    // Pausa o timer ao passar o mouse
    toast.addEventListener('mouseenter', function () {
      clearTimeout(timer);
      toast.style.setProperty('animation-play-state', 'paused', 'important');
      // pausa a barra de progresso via pseudo-elemento não é possível direto,
      // então só pausamos o timer mesmo
    });
    toast.addEventListener('mouseleave', function () {
      timer = setTimeout(function () { removerToast(toast); }, DURACAO / 2);
    });
  });
})();
</script>
{% endif %}
